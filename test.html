<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <style>
        .row > div {
            min-width: 150px;
            min-height: 150px;
            flex: 0 0 auto;
            cursor: pointer;
            transition: flex-grow 0.32s cubic-bezier(0.2, 0.9, 0.2, 1),
                        flex-shrink 0.32s cubic-bezier(0.2, 0.9, 0.2, 1),
                        flex-basis 0.32s cubic-bezier(0.2, 0.9, 0.2, 1),
                        min-width 0.32s cubic-bezier(0.2, 0.9, 0.2, 1);
        }
        .row[data-expanded="0"] > div:nth-child(1) { flex: 1 1 0; min-width: 0; }
        .row[data-expanded="1"] > div:nth-child(2) { flex: 1 1 0; min-width: 0; }
        .row[data-expanded="2"] > div:nth-child(3) { flex: 1 1 0; min-width: 0; }
        .row[data-expanded="3"] > div:nth-child(4) { flex: 1 1 0; min-width: 0; }
    </style>
</head>
<body>
    <div class="row" id="row" data-expanded="0" style="display: flex; flex-direction: row; width: 100%;">
        <div data-expand="0" style="background-color: #e57373;"><span>1</span></div>
        <div data-expand="1" style="background-color: #81c784;"><span>2</span></div>
        <div data-expand="2" style="background-color: #64b5f6;"><span>3</span></div>
        <div data-expand="3" style="background-color: #ffb74d;"><span>4</span></div>
    </div>
    <script>
        var row = document.getElementById('row');
        row.querySelectorAll('[data-expand]').forEach(function(div) {
            div.onclick = function() { row.dataset.expanded = div.getAttribute('data-expand'); };
        });
    </script>
</body>
</html>
